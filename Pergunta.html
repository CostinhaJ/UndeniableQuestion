<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pergunta Irrecusável</title>
  <link rel="shortcut icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/512/210/210545.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding: 2rem;
      width: 100%;
      min-height: 100vh;
      background-image: linear-gradient(to right bottom, #cffafe, #22d3ee);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .header-container {
      margin-bottom: 8rem; /* Add margin to create space below the header */
    }

    .header-img {
      max-width: 100%;
      filter: drop-shadow(5px 5px 20px rgba(0, 0, 0, 0.2));
    }

    .btn {
      position: absolute;
      padding: 0.75rem 1rem;
      font-size: 1.25rem;
      outline: none;
      border: none;
      background-color: #f8fafc;
      border-radius: 5px;
      box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #e2e8f0;
      box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.2);
    }

    .btn-yes {
      top: 70%; /* Adjusted initial position */
      left: 30%;
    }

    .btn-no {
      top: 70%; /* Adjusted initial position */
      left: 65%;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <img src="https://t4.ftcdn.net/jpg/07/13/60/93/240_F_713609336_7WWMGjAyrq7LwnTOMjOnHj1QMZVOq3KU.jpg" alt="date?" class="header-img" />
    <br>
    <br>
    <h2>Pergunta irrecusável?</h2>
  </div>
  <div>
    <button class="btn btn-yes">Yes</button>
    <button class="btn btn-no">No</button>  
  </div>
  <script>
    const btnYes = document.querySelector(".btn-yes");
    const btnNo = document.querySelector(".btn-no");
    const height = window.innerHeight;
    const width = window.innerWidth;

    btnYes.addEventListener("click", () => {
      alert("Mensagem de sucesso!");
    });

    btnNo.addEventListener("mouseover", () => {
      let rndW = Math.random() * (width - btnNo.offsetWidth);
      let rndH = Math.random() * (height - btnNo.offsetHeight);
      btnNo.style.left = rndW + 'px';
      btnNo.style.top = rndH + 'px';
    });

    btnYes.addEventListener("click", () => {
      alert("Porquê tanta resistência? :(!");
    });

  </script>
</body>
</html>
